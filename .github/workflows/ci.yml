name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    # ubuntu-latest runners ship with Docker preinstalled and running,
    # so the integration test suite exercises real containers here —
    # nothing is mocked.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Docker is available
        run: docker version

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run integration test suite (real Docker)
        run: pytest tests/ -v
